name: Build and Deploy to Stage

on:
  push:
    branches:
      - dev

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout dev branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Deploy to stage branch
        run: |
          BUILD_DIR="dist/calculadora-dev/browser"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Check if stage branch exists remotely
          if git ls-remote --exit-code --heads origin stage; then
            git checkout stage
            git pull origin stage
          else
            git checkout --orphan stage
            git rm -rf .
          fi

          # Clean everything in the branch
          git rm -rf . --ignore-unmatch

          # Copy build output to root
          cp -r $BUILD_DIR/. .

          # Remove the dist directory if it was copied over
          rm -rf dist

          # Stage all files
          git add -A

          # Commit only if there are changes
          if git diff --cached --quiet; then
            echo "No changes to deploy."
          else
            git commit -m "deploy: build from dev @ $(date -u '+%Y-%m-%d %H:%M:%S UTC') [${GITHUB_SHA::7}]"
            git push -u origin stage
          fi
