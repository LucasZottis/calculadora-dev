<div class="page-container">
    <nav class="breadcrumbs">
        <ol>
            <li><a routerLink="/">Início</a></li>
            <li><a routerLink="/validadores">Validadores</a></li>
            <li><span>CNPJ</span></li>
        </ol>
    </nav>

    <!-- Título da Subcategoria -->
    <div class="category-header">
        <div class="category-icon">
            <span class="material-symbols-outlined">fact_check</span>
        </div>
        <div class="category-info">
            <h1>Validdor de CNPJ</h1>
            <p>Verifique se um número de CNPJ é válido e aprenda como calcular os dígitos verificadores</p>
        </div>
    </div>

    <form class="form">
        <div class="row">
            <div class="col-12 col-sm-6 col-md-4 col-lg-3 col-xl-2 col-xxl-2 mx-auto">
                <div id="formulario">
                    <!-- <label for="txt-cnpj" class="form-label">Digite o CNPJ</label> -->
                    <input type="text" class="form-control text-center" id="txt-cnpj" maxlength="18" name="txt-cnpj"
                        placeholder="00.000.000/0000-00" [(ngModel)]="cnpj" (keypress)="onKeypress($event)"
                        (paste)="onPaste($event)">
                    <input type="button" class="btn btn-primary btn-sm mt-2 w-100" value="Validar"
                        (click)="validate()" />
                    <p id="lbl-resultado" class="text-center mx-0 mb-0 mt-2 fs-3" [style]="style">
                        {{result}}
                    </p>
                </div>
            </div>
        </div>
    </form>

    <section class="category-description">
        <div class="description-content">
            <explanation-cnpj-calculation />
        </div>
    </section>
</div>
